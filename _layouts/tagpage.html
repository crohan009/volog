---
layout: default
---
<div class="post other-pages tag-page">
    <h1 class="page-heading">{{ page.tag }}</h1>
    <p class="tag-description">Posts tagged with <span class="tag-highlight">{{ page.tag }}</span></p>
    
    <ul class="archive-list">
    {% for post in site.tags[page.tag] %}
        <li>
            <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
            <span class="date">{{ post.date | date: "%b %d, %Y" }}</span>
        </li>
    {% endfor %}
    </ul>
</div>

<style>
.tag-page {
    max-width: 700px;
    margin: 0 auto;
}

.tag-description {
    color: var(--text-muted, #a1a1aa);
    margin-bottom: 2rem;
}

.tag-highlight {
    color: var(--accent-primary, #00f0ff);
    font-family: 'JetBrains Mono', monospace;
    background: rgba(0, 240, 255, 0.1);
    padding: 2px 8px;
    border-radius: 4px;
}

body.light-mode .tag-highlight {
    background: rgba(3, 105, 161, 0.1);
}

.archive-list {
    list-style: none;
    margin: 0;
    padding: 0;
}

.archive-list li {
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
    background: var(--bg-card, #161622);
    border: 1px solid var(--border-color, #27272a);
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s ease;
}

.archive-list li:hover {
    border-color: var(--accent-primary, #00f0ff);
    transform: translateX(5px);
}

.archive-list li a {
    color: var(--text-heading, #ffffff);
    font-weight: 500;
    text-decoration: none;
    flex: 1;
}

.archive-list li a:hover {
    color: var(--accent-primary, #00f0ff);
}

.archive-list li .date {
    color: var(--text-dim, #71717a);
    font-size: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
    margin-left: 1rem;
}
</style>
