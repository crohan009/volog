<header class="site-header" role="banner" id='header-bar'>
    <div class="wrapper">
        <a class="site-title" href="{{ "/" | relative_url }}">
            {% assign title_escaped = site.title | escape %}
            {% assign title_with_highlight = title_escaped | replace: '`eigen`', '<span class="highlight">ei &gt;= n</span>' | replace: 'eigen', '<span class="highlight">ei &gt;= n</span>' %}
            <span class="site-title-text">{{ title_with_highlight }}</span>
        </a>
        
        <!-- Hamburger Menu Button (Mobile) -->
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger" class="menu-icon" aria-label="Toggle navigation">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </label>
        
        <nav class="site-nav">
            <div class="nav-links">
                <a class="page-link" href="{{ '/archive.html' | relative_url }}">
                    <span class="nav-icon">&#x1F4DA;</span><span class="nav-text">Archive</span>
                </a>
                <a class="page-link" href="{{ '/about.html' | relative_url }}">
                    <span class="nav-icon">&#x1F464;</span><span class="nav-text">About</span>
                </a>
            </div>
            <div class="theme-toggle">
                <input type="checkbox" onclick="toggleDarkMode()" id="switch" name="theme" />
                <label for="switch" class="toggle-label" aria-label="Toggle dark mode">
                    <span class="toggle-icon sun" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2"></path>
                            <path d="M12 20v2"></path>
                            <path d="M4.93 4.93l1.41 1.41"></path>
                            <path d="M17.66 17.66l1.41 1.41"></path>
                            <path d="M2 12h2"></path>
                            <path d="M20 12h2"></path>
                            <path d="M4.93 19.07l1.41-1.41"></path>
                            <path d="M17.66 6.34l1.41-1.41"></path>
                        </svg>
                    </span>
                    <span class="toggle-icon moon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                            <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5Z"></path>
                        </svg>
                    </span>
                </label>
            </div>
        </nav>
    </div>
</header>
